name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Epic 2: toda a suíte roda sem segredos nem rede do Supabase. Sob Vitest os repositórios
      # operam em modo 'local' (supabaseHelpers.js) e os testes de modo remoto mockam o
      # supabase-js (getSupabaseDataClient/rpc). As variáveis abaixo zeram TODAS as que
      # src/lib/supabase.js lê (com e sem o prefixo VITE_, que o Vitest também repassa), para
      # que um segredo configurado no repositório nunca seja usado pelos testes. Testes SQL
      # contra banco real (supabase/tests/*.test.sql) não rodam no CI.
      - name: Run Tests (Vitest)
        run: npm test
        env:
          VITE_SUPABASE_URL: ''
          SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
          SUPABASE_PUBLISHABLE_KEY: ''
          VITE_SUPABASE_ANON_KEY: ''
          SUPABASE_ANON_KEY: ''

      - name: Build Application (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
