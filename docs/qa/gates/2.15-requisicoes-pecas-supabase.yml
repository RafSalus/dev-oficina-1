    suggested_action: 'Atualizar o Debug Log e as contagens da File List (@dev).'

regression_checks:
  - check: 'O trigger de UPDATE (trg_requisicoes_pecas_atendimento) interfere no UPDATE da secretaria?'
    result: >-
      Não. A secretaria atende e recusa normalmente (atendido_por_id = o funcionário dela, atendido_em = now()). Quando
      só observacoes muda, o atendimento é preservado e a tentativa de forjar atendido_por_id/atendido_em é ignorada.
      Ao reabrir, os campos são limpos. Secretaria sem vínculo de funcionário também atende (atendido_por_id NULL).
      A ordem dos BEFORE UPDATE (alfabética: atendimento → set_updated_at) não causa conflito, e a auditoria continua
      registrando. Efeito colateral aceitável: admin não consegue corrigir atendido_por_id sem mudar o status.
  - check: 'solicitante_nome via SECURITY DEFINER vaza algo?'
    result: >-
      Não. Para o mecânico o solicitante_id é forçado para ele próprio, então ele só lê o próprio nome (sonda:
      solicitante_id de funcionário inativo/oculto → gravou q-mec/"Q Mec"). Para papel NULL e para secretaria, o INSERT
      é barrado pela RLS depois do trigger, com mensagem genérica que não expõe a linha. Só o admin (que já lê
      funcionarios) grava outro solicitante. search_path vazio e nomes qualificados. EXECUTE continua concedido a
      anon/authenticated por default privileges, mas a chamada direta falha ("trigger functions can only be called as
      triggers").
  - check: 'Importação/carga por admin ou service_role'
    result: 'INSERT de admin mantém status/atendimento informados, mas solicitante_nome passa a vir do cadastro (comportamento desejado).'
  - check: 'Outros consumidores de pedirPecaParaOS/atualizarStatusRequisicao'
    result: 'pedirPecaParaOS: só MecanicoDashboardPage. atualizarStatusRequisicao: nenhum consumidor em src (sem tela da secretaria).'

