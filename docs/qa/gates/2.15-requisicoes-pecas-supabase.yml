fix_commit_f3f905e:
  verdict: 'Correto e suficiente'
  note: >-
    Produção confirma que fn_audit()/fn_audit_log() nunca existiram e fn_audit_trigger() existe. A cadeia completa sobe
    em banco limpo; a varredura dos corpos plpgsql não encontrou outras chamadas quebradas; a 240000 (2.14) não tinha o
    defeito. O stub de sequences espelha a produção. Observação: não há testes SQL para 2.7–2.14, então o comportamento
    em tempo de execução dessas migrations segue sem cobertura automatizada (fora do escopo desta story).

d4_decision:
  verdict: 'Correta, sem lacuna'
  note: >-
    ADR-005 §2.10 (linha 163) e PRD v1.5 (linha 115) listam "requisições" explicitamente fora da janela D4 até decisão
    do proprietário. A justificativa do Dev ("o AC4 não exige") está certa, mas a base mais forte é o próprio ADR/PRD.

