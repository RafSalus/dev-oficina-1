top_issues:
  - id: 'REL-001'
    severity: high
    finding: >-
      src/pages/mecanico/MecanicoDashboardPage.jsx:227-260 — handleRequisitarPeca chama pedirPecaParaOS (agora
      async, retorna null em erro) sem await e, incondicionalmente, adiciona a peça em osAtiva.pecasOS com
      statusRequisicao 'Requisitada pelo Mecânico' (salvarOrdemAberta + recarregarOrdens). Em falha remota
      (RLS, rede, mecânico sem vínculo) o usuário vê "Nada foi salvo" e, ao mesmo tempo, a OS mostra a peça
      como requisitada — a requisição não existe no banco e ninguém a atende. Regressão introduzida pela
      mudança síncrono → assíncrono; contraria AC2/AC3 (fail-closed, mesma semântica para a UI) e NFR14.
    suggested_action: >-
      Tornar handleRequisitarPeca async: `const req = await pedirPecaParaOS({...}); if (!req) return;` antes de
      mexer em pecasOS; opcionalmente desabilitar o botão durante o envio. Adicionar teste (componente ou
      integração) cobrindo o caminho de falha: pecasOS inalterado e nenhum toast de sucesso.
  - id: 'SEC-001'
    severity: medium
    finding: >-
      supabase/migrations/20260926250000_requisicoes_pecas.sql:58-70 e :127-132 — no INSERT o mecânico controla
      status, atendido_por_id, atendido_em, motivo_recusa e solicitante_nome. Sonda em PG17: mecânico inseriu
      {status: 'atendida', atendido_por_id: <outro funcionário>, solicitante_nome: 'Outro Nome'} com sucesso.
      O teste SQL só verifica que o mecânico não faz UPDATE de status; o INSERT contorna essa regra e forja
      atendimento atribuído a terceiro (a trilha de auditoria registra o ator real, o que limita o dano).
    suggested_action: >-
      No trigger BEFORE INSERT, para papel 'mecanico' forçar status := 'aguardando_separacao' e zerar
      atendido_por_id/atendido_em/motivo_recusa (ou restringir no WITH CHECK da política de INSERT do mecânico).
      Opcional: derivar solicitante_nome de funcionarios.nome no próprio trigger (aí o SECURITY DEFINER passa a
      ter função). Acrescentar asserção no teste SQL e a mutação correspondente no harness.
  - id: 'TEST-001'
    severity: medium
    finding: >-
      Nenhum teste exercita o consumidor real (handleRequisitarPeca) — por isso REL-001 passou com 359/359
      verdes. O teste de contexto valida o fail-closed só dentro do MecanicoContext. O teste SQL não cobre
      INSERT forjado de status/atendimento nem conta autenticada sem papel (a sonda confirmou negação).
    suggested_action: >-
      Teste do fluxo de requisição na página (falha e sucesso); no SQL, casos "mecânico insere status atendida"
      e "authenticated sem papel" (INSERT/SELECT negados).
  - id: 'MNT-001'
    severity: low
    finding: >-
      atendido_por_id nunca é preenchido e atendido_em vem do relógio do cliente
      (src/repositories/requisicoesPecasRepository.js:115-117).
    suggested_action: >-
      Trigger BEFORE UPDATE que, ao mudar para 'atendida'/'recusada', grava atendido_por_id =
      funcionario_atual_id() e atendido_em = now(); o repositório deixa de enviar atendido_em.
  - id: 'MNT-002'
    severity: low
    finding: >-
      src/repositories/mapeadores/requisicoesPecas.js:18-22 — statusParaCodigo(undefined/'') devolve
      'aguardando_separacao'; logo atualizarStatusRequisicao(id) sem status reabre a requisição em silêncio
      em vez de recusar a chamada.
    suggested_action: 'Em atualizarStatusRequisicao, exigir status explícito (falsy → erro).'
  - id: 'MNT-003'
    severity: low
    finding: >-
      migration :58-72 — SECURITY DEFINER é desnecessário (papel_usuario/funcionario_atual_id já são DEFINER)
      e o REVOKE EXECUTE FROM PUBLIC é ineficaz (default privileges concedem a anon/authenticated;
      has_function_privilege = true). Não é explorável: search_path vazio, só atribui NEW.solicitante_id a
      partir da sessão e chamada direta falha ("trigger functions can only be called as triggers").
    suggested_action: 'Trocar para SECURITY INVOKER (ou manter e justificar se SEC-001 passar a ler funcionarios).'
  - id: 'REL-002'
    severity: low
    finding: >-
      carregandoRequisicoes é exposto mas nenhum consumidor o usa: contadores de MecanicoHeaderMetricas e
      MecanicoVisaoGeral mostram "0" até a carga terminar (o "flash" citado nos Riscos da story).
    suggested_action: 'Exibir placeholder/skeleton enquanto carregandoRequisicoes for true.'
  - id: 'DOC-001'
    severity: low
    finding: >-
      supabase/tests/2.15_requisicoes_pecas.test.sql:4-6 sugere `db query --linked` (que hoje é PRODUÇÃO) e o
      teste insere em auth.users; o Dev Agent Record fala em "5/5 mutações" mas lista 6 cenários (o harness
      executa 6, todos detectados).
    suggested_action: 'Indicar banco local/dev no cabeçalho do teste; corrigir a contagem no registro.'

