schema: 1
story: '2.15'
story_title: 'Requisições de Peças do Mecânico para Supabase Postgres (Nova Tabela)'
gate: FAIL
status_reason: >-
  Banco, RLS D5 e repositório estão corretos e bem testados, mas pedirPecaParaOS virou async e o único
  consumidor (MecanicoDashboardPage.handleRequisitarPeca) não aguarda o resultado: em falha o toast diz
  "Nada foi salvo" e mesmo assim a peça é gravada na OS como "Requisitada pelo Mecânico" (fail-closed
  quebrado na UI). Além disso, o mecânico consegue inserir requisição já "atendida" com atendido_por_id de outro funcionário.
reviewer: 'Quinn (@qa)'
reviewed_revision: 'commit:e3c7f03 (sobre f3f905e e 1e665a4), branch feat/2.15-requisicoes-pecas-supabase'
updated: '2026-09-26T16:10:00-03:00'

