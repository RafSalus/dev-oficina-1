      Agent Record o declara como não corrigido.
    suggested_action: 'Mostrar placeholder/skeleton enquanto carregandoRequisicoes for true (pode ir para o backlog).'
  - id: 'TEST-002'
    severity: low
    finding: >-
      A correção MNT-002 (src/repositories/requisicoesPecasRepository.js:110) não tem teste. O QA reverteu para
      `statusParaCodigo(status)` e tests/unit/requisicoesPecasRepository.test.js continuou 12/12 verde.
    suggested_action: 'Adicionar o caso `atualizarStatusRequisicao(id)` / `(id, "")` → rejeita com ErroRepositorio sem chamar o banco.'
  - id: 'MNT-004'
    severity: low
    finding: >-
      supabase/migrations/20260926250000_requisicoes_pecas.sql:101-113 — o trigger de atendimento só cuida de
      atendido_em/atendido_por_id. Quando a requisição passa de recusada para atendida, motivo_recusa continua preenchido
      (sonda do QA: status 'atendida' com motivo_recusa 'sem estoque'). O repositório só grava motivo_recusa ao recusar.
      Sem consumidor de UI hoje, porque não existe tela da secretaria.
    suggested_action: 'No mesmo trigger, zerar motivo_recusa quando NEW.status <> ''recusada'' (ou fazer isso no repositório).'
  - id: 'REL-003'
    severity: low
    finding: >-
      src/pages/mecanico/components/MecanicoPedirPecas.jsx:110-113 — o botão "Pedir Peça" não fica desabilitado
      durante o envio, que agora é assíncrono. Um duplo clique cria 2 requisições e adiciona a peça 2x em pecasOS.
      Além disso, handleRequisitarPeca (MecanicoDashboardPage.jsx:256-260) usa o osAtiva capturado antes do await.
    suggested_action: 'Estado "enviando" que desabilita o botão; opcionalmente reler a OS ativa após o await.'
  - id: 'DOC-002'
    severity: low
    finding: >-
      docs/stories/2.15.requisicoes-pecas-supabase.md:132 ainda diz "5/5 mutações" listando 6 (resto de DOC-001). A File
