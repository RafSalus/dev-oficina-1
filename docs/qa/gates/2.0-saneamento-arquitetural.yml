resolved_from_iteration_1:
  - id: 'REQ-001'
    resolution: >-
      ClienteServicosPage.jsx: o estado vazio "Nenhuma ordem de serviço em andamento" voltou, avaliado antes do isMobile como no original.
      No mobile, ClienteServicosMobile (adaptador utils/aprovacao/aprovacaoMobile.js) alimenta MobileClienteServicosPage a partir do
      useAprovacaoOrcamento, e as telas mobile deixaram de ser órfãs. No portal, o botão "Fechar" fica oculto (mostrarFechar={false})
      e o rodapé é sticky dentro do container rolável (fixo={false}).
  - id: 'TEST-001'
    resolution: 'tests/unit/aprovacao-paginas.test.jsx: 8 testes das páginas inteiras (portal vazio, portal desktop, portal mobile e página pública).'
  - id: 'DOC-001'
    resolution: 'Números medidos em HEAD limpo e registrados na story; conferem com a execução do QA.'
  - id: 'REL-001'
    resolution: >-
      COMPORTAMENTO_POR_ORIGEM (aprovacaoCalculos.js): a página pública não avisa ao alternar opcional, usa a mensagem de sucesso original
      e abre o modal sem nome preenchido. respostasLocais volta a reiniciar só quando dadosOS.numeroOS muda (useAprovacaoOrcamento.js:85).
  - id: 'REQ-002'
    resolution: 'A rota pública não usa mais a OS do cliente logado. "Orçamento não localizado" para /aprovacao sem número foi mantido de propósito (aceito como melhoria, low).'
  - id: 'DOC-002'
    resolution: 'JSDoc adicionado.'

top_issues:
  - id: 'ARCH-001'
    severity: medium
    finding: >-
      NFR18 parcial, sem mudança desde a iteração 1: MobileComprasPage.jsx (943L) e MobileEstoquePage.jsx (687L) não usam
      useComprasWorkflow nem useEstoqueWorkflow. PDVPage.jsx (805L) e MobileNovaOrdemDeServicoPage.jsx (487L) seguem acima de 400L.
    suggested_action: '@po registrar a story 2.0b (decomposição das telas mobile reaproveitando os hooks) e anotar a pendência no epic.'
  - id: 'REL-002'
    severity: low
    finding: >-
      Adaptador mobile do portal, src/utils/aprovacao/aprovacaoMobile.js:14-29 (itemMobile): (1) `preco` recebe precoUnitario, e
      MobileSecaoItens.jsx:63 mostra preco × quantidade, ignorando o desconto por item, enquanto os totais usam o subtotal líquido.
      Com item descontado, a linha e o total divergem. (2) `marca` recebe parceiroNome, então em peças a marca sai vazia
      (" • Qtd N" em MobileClienteServicosPage.jsx:310).
    suggested_action: 'Usar preco = subtotal / quantidade (ou expor o subtotal) e mapear marca da peça quando existir, com fallback sem o separador.'
  - id: 'REL-003'
    severity: low
    finding: >-
      MobileClienteServicosPage.jsx:264: a aba Fotos passou a filtrar peças sem foto (`.filter((peca) => peca.foto)`).
      Faz sentido (evita <img> sem src), mas muda a apresentação do legado. Hoje o legado nunca recebia dados, então o impacto é nulo.
    suggested_action: 'Nenhuma ação obrigatória; só registrar.'

strengths:
  - 'Correções pontuais e bem isoladas: as diferenças entre telas viraram configuração declarativa (COMPORTAMENTO_POR_ORIGEM), sem duplicar regra.'
  - 'Testes das páginas inteiras cobrem exatamente os cenários que escaparam na iteração 1, inclusive o caminho mobile.'

