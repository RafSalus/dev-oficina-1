status_reason: >-
  A decomposição de Compras, Cotação, OS, Painel, Estoque e Cliente preserva o comportamento e está bem feita,
  mas a rota /cliente/servicos regrediu (estado vazio virou "Em breve", a versão mobile foi abandonada e o layout
  público foi embutido no portal), o que viola o AC7 (comportamento idêntico) e o AC5/NFR18 (casca mobile sobre o mesmo hook).
