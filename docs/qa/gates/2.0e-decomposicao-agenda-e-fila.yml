      result: '0 erros (exit 0).'
    - cmd: 'npm run build'
      result: 'OK em 8.78s. Aviso de chunk > 1000 kB já existia antes da story.'
    - cmd: 'wc -l (39 arquivos do diff)'
      result: 'Maior arquivo: useAgendaWorkflow.js com 310 linhas. Todos ≤ 400 (NFR17).'
    - cmd: 'comparação automática de literais JSX/strings (main x HEAD) nos 7 arquivos originais'
