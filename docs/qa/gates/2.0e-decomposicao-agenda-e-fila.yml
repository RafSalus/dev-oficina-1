schema: 1
story: '2.0e'
story_title: 'Decomposição da Agenda Dinâmica e Fila de Espera (Lote 3 de Arquitetura)'
gate: CONCERNS
status_reason: >-
  Refatoração comportamentalmente neutra confirmada por revisão linha a linha contra main (7 arquivos originais x 34 arquivos novos):
  mesmas validações e mensagens de toast, mesma ordem de campos, mesmo reset de formulário ao abrir, mesmas keys, cascata de atrasos
  e envio do 1º da fila idênticos, e nenhum texto visível perdido (comparação automática de literais). Todos os ACs atendidos; 199/199
  testes, lint 0 erros e build ok. O veredito é CONCERNS, e não PASS, porque a verificação ficou incompleta: a cascata de atrasos,
  apontada como risco nas Dev Notes, não tem teste nem verificação manual; o roteiro manual não foi executado (login Supabase + MFA) e o
  CodeRabbit não rodou (CLI ausente também no ambiente do QA). Nenhum achado bloqueia o fechamento.
