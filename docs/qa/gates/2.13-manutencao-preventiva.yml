schema: 1
story: '2.13'
story_title: 'Migração de Manutenção Preventiva para Supabase Postgres'
gate: PASS
status_reason: >-
  Módulo de Manutenção Preventiva migrado com sucesso para Supabase Postgres.
  Nova tabela public.manutencoes_preventivas criada com chaves estrangeiras para veiculos(id) e funcionarios(id).
  RPC restrita public.atualizar_hodometro_veiculo criada (SECURITY DEFINER) permitindo que mecânicos e secretárias atualizem km_atual em veiculos com validação contra regressão.
  Repositório assíncrono manutencaoPreventivaRepository criado seguindo fail-closed (ADR-002), sem fallback silencioso para localStorage em modo remoto.
  Catálogo de itens preventivos mantido como constante estática (AC2) extraído para src/constants/catalogoPreventivo.js.
  Função pura calcularSaudeVeiculo preservada com dados reais do Postgres.
  RLS implementada com public.papel_usuario() e horário operacional D4. Triggers trg_set_updated_at e trg_audit vinculadas.
  Todos os testes unitários passando, 0 erros no lint, build Vite verde e arquivos <= 400 linhas (NFR17).
