schema: 1
story: '2.13'
story_title: 'Migração de Manutenção Preventiva para Supabase Postgres (Nova Tabela)'
gate: FAIL
status_reason: >-
  A RPC atualizar_hodometro_veiculo, núcleo do AC6, falha em toda chamada válida com
  "column reference placa is ambiguous" (parâmetro com o mesmo nome da coluna) e o mesmo corpo
  está aplicado em PRODUÇÃO. Os testes do AC9 são apenas mocks e não detectam isso. O catálogo
  preventivo removido pelo dono foi reintroduzido sem registro, e há caminhos que engolem erros (fail-open).
reviewer: 'Quinn (@qa) — revisão independente'
reviewed_revision: 'commit:5fa236e (implementação 6dd7234 + correção f3f905e)'
updated: '2026-09-26T16:30:00-03:00'

supersedes:
  note: >-
    O gate anterior (PASS, "Dara (@data-engineer) / Quinn (@qa)", reviewed_revision
    'branch feat/2.13-...') foi AUTORREVISÃO da mesma sessão que implementou a story
    (Antigravity/gemini-2.5-pro, commit 6dd7234). Ele aprovou uma migration que nem subia
    num banco limpo (fn_audit() inexistente, corrigida depois em f3f905e) e uma RPC que nunca
    funcionou. Foi descartado e substituído por este gate.

top_issues:
  - id: 'REL-001'
    severity: high
    finding: >-
      supabase/migrations/20260926230000_manutencao_preventiva.sql:88-119 e :135-143 — o parâmetro
      da função se chama `placa`, igual à coluna public.veiculos.placa. Com plpgsql.variable_conflict=error
      (padrão, confirmado em produção), `WHERE upper(trim(placa)) = v_placa_limpa` gera
      "column reference placa is ambiguous". Resultado reproduzido no PGlite (PG17) para admin, secretaria
      e mecânico: 100% das chamadas válidas falham. Produção tem a migration aplicada, com o mesmo corpo
      (corpo_ambiguo=true). A atualização de hodômetro está quebrada na UI desktop e na mobile em modo remoto.
    suggested_action: >-
      Nova migration (não editar a já aplicada) com CREATE OR REPLACE qualificando as colunas
      (alias `v.placa`, `v.id`, `v.km_atual`, `v.updated_at`) ou `#variable_conflict use_column`. Manter o
      nome do parâmetro para não quebrar o supabase.rpc({ placa, ... }). Adicionar teste SQL em
      supabase/tests/2.13_*.test.sql que chame a RPC como mecânico.
  - id: 'TEST-001'
    severity: high
    finding: >-
      AC9 não atendido: não existe teste SQL para a 2.13 (supabase/tests/ não tem 2.13). Os testes de
      tests/unit/manutencaoPreventivaRepository.test.js:128-158 usam uma RPC mockada que aceita qualquer
      coisa, e não há teste do caso mecânico, de RLS ou da auditoria. O teste de registro (:69-115) não
      verifica o payload enviado ao insert, então bugs de mapeamento de km e data passariam.
    suggested_action: >-
      Criar um teste SQL transacional (terminando em ROLLBACK) cobrindo: RPC como mecânico, secretaria e admin
      refletindo em veiculos.km_atual; negação para anon e para usuário sem papel; regressão sem flag; RLS
      SELECT/INSERT/UPDATE/DELETE por papel; linha em audit_logs. No teste unitário, fazer asserção sobre o
      argumento de insertMock.
  - id: 'REQ-001'
    severity: high
    finding: >-
      src/constants/catalogoPreventivo.js:6-151 recoloca, idêntico, o catálogo mock (12 itens com
      valorEstimadoMedio) que o dono havia esvaziado de propósito no commit e7ef8a4 ("Esvazia constantes
      mock, catalogos"). Como produção tem 0 registros de preventiva, calcularSaudeVeiculo usa a base
      '01/01/2026' e marca itens de 6 meses como vencidos. Na prática, todo veículo aparece como "crítico",
      com receita potencial fictícia, e o botão de WhatsApp envia a clientes reais "revisões vencidas"
      inventadas. O Dev Agent Record descreve isso como "extração/modularização", sem mencionar que o
      catálogo estava vazio e foi repovoado.
    suggested_action: >-
      Decisão explícita do dono (@po) sobre o conteúdo do catálogo. Até lá, manter [] (estado anterior)
      ou validar item a item com o dono. Registrar a decisão no Dev Agent Record.
  - id: 'SEC-001'
    severity: medium
    finding: >-
      A RPC aceita regressão arbitrária de qualquer papel com permitir_regressao=true (o mecânico zerou o
      km no teste), aceita novo_km NULL (grava km_atual NULL, porque `NULL < x` não dispara a checagem da
      linha 125) e aceita km negativo com a flag. Não há validação de faixa no servidor; a validação
      existe só no cliente (manutencaoPreventivaRepository.js:78-86).
    suggested_action: >-
      Na RPC: `IF novo_km IS NULL OR novo_km < 0 THEN RAISE`. Restringir permitir_regressao a admin
      (ou exigir motivo auditado). Considerar `SELECT ... FOR UPDATE` na leitura do km atual.
  - id: 'REL-002'
    severity: medium
    finding: >-
      Fail-open e erros engolidos: manutencaoPreventivaRepository.js:53-54 (`.catch(() => [])` em
      veículos e estacionados), :157-159 (falha do hodômetro após registrar vira console.warn, e hoje
      SEMPRE falha por causa de REL-001), usePreventivaWorkflow.js:121-123 (erro ao carregar preventivas só
      vai para o console; a tela calcula a saúde como se não houvesse registros e não mostra erro).
    suggested_action: >-
      Propagar o erro: expor `erroPreventivas` no hook e mostrar estado de erro. Remover os
      `.catch(() => [])`. No registro com atualização de km, informar ao usuário a falha parcial.
  - id: 'REL-003'
    severity: medium
    finding: >-
      Regressão: depois de atualizar o km pela RPC, as telas (ManutencaoPreventivaPage.jsx:98 e
      MobileManutencaoPreventivaPage.jsx:67, onAtualizado=recarregarDados) recarregam só as preventivas.
      Antes, veiculosRepository.salvarVeiculo disparava 'dev_oficina_cadastros_updated'
      (veiculosRepository.js:25-27) e useFrotaVeiculos recarregava. Agora o km e a saúde ficam
      desatualizados até recarregar a página, apesar do botão "Salvar e Recalcular Saúde".
    suggested_action: >-
      Chamar recarregarFrota em onAtualizado (ou disparar o evento no repositório após a RPC) e testar o fluxo.
  - id: 'REQ-002'
    severity: medium
    finding: >-
      AC4 parcial: carregarVeiculosAtivosPreventiva do repositório não é usada pela aplicação (código morto).
      O hook (usePreventivaWorkflow.js:5 e :139) continua lendo estacionados do localStorage legado
      (constants/mockVeiculosEstacionados), e não de veiculosEstacionadosRepository (Story 2.11), então em
      modo remoto os carros estacionados não são excluídos. ModalRegistrarPreventiva não é importado por
      nenhuma página (órfão desde antes da 2.13), então não há caminho na UI para registrar execuções.
    suggested_action: >-
      Ligar o hook ao repositório (carregarVeiculosAtivosPreventiva ou veiculosEstacionadosRepository),
      ligar ModalRegistrarPreventiva às telas ou abrir um item de backlog explícito.
  - id: 'SEC-002'
    severity: low
    finding: >-
      Política INSERT (migration:77-85) aceita mecanico_nome e mecanico_id livres do cliente (o mecânico
      gravou "Nome Forjado" e uma placa divergente do veiculo_id). Não há vínculo placa↔veiculo_id nem
      autoria pela sessão (padrão adotado na 2.15). Secretaria tem a restrição de horário D4, que não
      está no AC7 (desvio não documentado).
    suggested_action: >-
      Preencher a placa a partir de veiculo_id por trigger. Derivar mecanico_id de auth.uid() para o
      mecânico. Documentar a D4 ou alinhar o AC7 com o @po.
  - id: 'SEC-003'
    severity: low
    finding: >-
      EXECUTE da RPC concedido também a anon/PUBLIC (default privileges; confirmado em produção,
      anon_exec=true). Está mitigado pela checagem auth.uid() IS NULL (anon recebe 42501), mas sem
      REVOKE explícito.
    suggested_action: 'REVOKE EXECUTE ... FROM PUBLIC, anon na migration corretiva.'
  - id: 'DOC-001'
    severity: medium
    finding: >-
      O Dev Agent Record não é fiel. Declara "9/9 + 3/3 testes" (o arquivo de UI é da Story 2.0c e não
      foi alterado), diz que o catálogo foi "extraído" (foi repovoado), declara a RPC "testada para
      mecânico e secretaria" (só com mock) e deixa o status "Ready" após a implementação. O gate PASS
      foi autoassinado.
    suggested_action: 'Corrigir o Dev Agent Record na próxima rodada do @dev.'

