schema: 1
story: '2.4'
story_title: 'Correção da Suíte de Testes de Guards de Autenticação e Gate de CI do Epic 2'
gate: CONCERNS
status_reason: >-
  Os ACs 1 a 6 foram verificados de forma independente. O comportamento do ProtectedRoute é equivalente ao de main, as 12 mutações
  do QA em routeAccessRules.js foram detectadas e a suíte passa 225/225 sem .env, sem variáveis e sem rede. O veredito é CONCERNS
  porque a ligação do ProtectedRoute/AdminAuthContext com as regras continua pouco testada: 7 de 8 mutações nessa camada sobreviveram.
reviewer: 'Quinn (@qa)'
reviewed_revision: 'commit:6927314 (branch feat/2.4-testes-guards-ci), diff main...HEAD'
updated: '2026-09-26T11:50:00-03:00'

