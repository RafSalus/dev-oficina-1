schema: 1
story: '2.9'
story_title: 'Migração de Compras (Pedidos) e Cotações para Supabase Postgres'
gate: PASS
status_reason: >-
  Módulo de Compras (Pedidos) e Cotações migrado com sucesso para Supabase Postgres.
  Sequences dedicadas aplicadas no banco por trigger garantem numeração sequencial sem padrão client-side.
  RPCs transacionais receber_pedido_compra e aprovar_cotacao_gerar_pedido asseguram operações atômicas sem corridas.
  Mapeamento de status bidirecional trata a divergência CANCELADA <-> cancelada no repositório (AC3).
  RLS FR25 aplicada (admin total, secretaria SELECT/INSERT/UPDATE sob em_horario_operacional(), DELETE restrito ao admin).
  Zero políticas para o papel anon (regressão temporária aceita e declarada para Story 2.17).
  Fail-closed implementado via executarRepositorio/executarOperacao, 299/299 testes passando, lint zerado e NFR17 respeitado (< 380 linhas em todos os arquivos).
