schema: 1
story: '2.9'
story_title: 'Migração de Compras (Pedidos) e Cotações para Supabase Postgres'
gate: FAIL
status_reason: >-
  Revisão independente (substitui o gate PASS anterior, que era autorrevisão do implementador).
  A migration sobe num banco limpo e a RLS FR25/D4 está correta, mas nenhuma tela usa o
  comprasRepository: compras e cotações continuam só no localStorage, com numeração "maior + 1"
  no front. Com isso, o objetivo da story não é entregue e o AC10 e itens do DoD estão marcados
  sem ter sido cumpridos. Além disso, a RPC receber_pedido_compra muda a regra de negócio da OS:
  aprova uma OS que aguarda o cliente e não avança a OS que aguarda peças.
reviewer: 'Quinn (@qa) — revisão independente'
previous_gate:
  gate: PASS
  note: >-
    Gate anterior (commit e6d2c7a) foi autorrevisão: registrado pela mesma sessão que implementou,
    com reviewed_revision apontando para uma branch em vez de um SHA, sem sondas SQL e com
    AC10/DoD dados como PASS sem evidência. Descartado.
reviewed_revision: 'commit:5fa236e (implementação em e6d2c7a)'
updated: '2026-09-26T16:30:00-03:00'

scope:
  migrations:
    - supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql
  repositories:
    - src/repositories/comprasRepository.js
    - src/repositories/mapeadores/compras.js
  tests:
    - tests/unit/comprasRepository.test.js

evidence:
  commands:
    - cmd: 'npx vitest run'
      result: '45 arquivos, 362/362 testes passando'
    - cmd: 'npx eslint --quiet src/ tests/'
      result: '0 erros'
    - cmd: 'wc -l'
      result: 'repository 239, mapeador 186, migration 376, teste 352 — todos <= 400'
    - cmd: 'PGlite PG17: 19 migrations em banco limpo + sondas (scratchpad pgtest/qa29_probe.mjs)'
      result: >-
        Migrations aplicam sem erro. 8 políticas, 0 TO anon/public. RPCs SECURITY DEFINER + search_path=''.
        Secretaria: INSERT/SELECT/UPDATE OK dentro da janela; DELETE afeta 0 linhas; fora da janela INSERT
        bloqueado, UPDATE afeta 0 linhas, RPC levanta exceção. Mecânico, papel NULL e anon: SELECT 0, INSERT
        bloqueado, RPCs "Acesso negado". Sequences: PED-2026-001, PED-2026-002, COT-2026-9041. Triggers de
        auditoria/updated_at ativos (audit_logs com INSERT/UPDATE nas duas tabelas; updated_at forçado pelo cliente é sobrescrito).
    - cmd: 'npx supabase db query --linked (somente leitura, contagens/booleanos)'
      result: >-
        Migration 20260926190000 aplicada; 8 políticas, 0 anon; RPCs secdef; anon tem EXECUTE nas RPCs;
        6 triggers; 0 pedidos e 0 cotações na produção (compatível com a UI não gravar no Supabase);
        a RPC em produção contém a regra 'aguardando_aprovacao'.

top_issues:
  - id: QA29-001
    severity: high
    category: requirements
    refs:
      - 'src/hooks/useComprasWorkflow.js:4-13'
      - 'src/hooks/useComprasDados.js:2-6'
      - 'src/hooks/useCotacaoWorkflow.js:5-11'
      - 'src/hooks/useEstoqueWorkflow.js:10'
      - 'src/components/suprimentos/CompraModalForm.jsx:29-30'
      - 'src/pages/dashboard/suprimentos/mobile/MobileCompraFormModal.jsx:19-20'
    description: >-
      Nenhum consumidor de UI importa comprasRepository (só testes o usam). ComprasPage, MobileComprasPage,
      modais e hooks continuam lendo e gravando direto em constants/comprasData (localStorage). A troca de
      fonte de dados não chega às telas, e o objetivo da story (dados compartilhados entre usuários, sem
      colisão de numeração) não é entregue. Outras stories da onda (agenda, estacionados, preventiva,
      clientes) ligaram seus hooks aos repositórios; esta não.
    recommendation: >-
      Migrar useComprasWorkflow, useComprasDados, useCotacaoWorkflow, useEstoqueWorkflow e os modais de
      compra (desktop e mobile) para as funções assíncronas do comprasRepository, tratando erros sem
      fallback local.
  - id: QA29-002
    severity: high
    category: requirements
    refs:
      - 'src/components/suprimentos/CompraModalForm.jsx:89,128,352'
      - 'src/pages/dashboard/suprimentos/mobile/MobileCompraFormModal.jsx:84,116,229'
      - 'src/hooks/useComprasWorkflow.js:96,111,125,143'
      - 'src/hooks/useCotacaoWorkflow.js:104,213'
      - 'src/constants/comprasData.js:56-72,328-342'
      - 'src/repositories/mapeadores/compras.js:125,183'
    description: >-
      O padrão "maior + 1" no front continua sendo a fonte do número de pedido e de cotação
      (gerarProximoNumeroPedido/gerarProximoNumeroCotacao). O mapeador envia numero_pedido quando ele
      vem preenchido, e o trigger aceita número fornecido pelo cliente (sonda 10: 'PED-9999-999' gravado).
      O DoD "nenhum maior + 1 no front" está marcado [x], mas é falso.
    recommendation: >-
      No modo remoto, não gerar nem enviar numero_pedido/numero_cotacao; mostrar "gerado ao salvar".
      Opcional: o trigger passa a ignorar ou rejeitar número vindo do cliente.
  - id: QA29-003
    severity: high
    category: code
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:138-151'
      - 'src/constants/comprasData.js:139-160'
    description: >-
      A RPC receber_pedido_compra troca a regra da OS. O código original avança só a OS em
      'aguardando_pecas' e anota observacoesGerais. A RPC avança a OS em 'aguardando_aprovacao' para
      'aprovado_execucao', pulando a aprovação do cliente, e não escreve a anotação. Sondas 7b e 7e:
      OS aguardando_aprovacao virou aprovado_execucao; OS aguardando_pecas ficou parada. Isso contraria
      o AC4 ("nenhuma mudança de fluxo de negócio"). O mesmo corpo está em produção.
    recommendation: >-
      Nova migration: condicionar a 'aguardando_pecas' (que já existe no CHECK desde 20260926240000),
      acrescentar a anotação de recebimento e cobrir com teste SQL.
  - id: QA29-004
    severity: medium
    category: security
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:124-133'
    description: >-
      Kardex com autoria fixa: a RPC passa p_usuario = 'Rafael Almoxarife' para
      registrar_movimentacao_estoque. Isso anula o fallback funcionario_atual_id(), e toda entrada por
      recebimento é atribuída a um nome fixo (sonda 7b: usuario = 'Rafael Almoxarife'). Quebra a
      rastreabilidade do Kardex.
    recommendation: 'Passar NULL, para a função resolver o funcionário da sessão.'
  - id: QA29-005
    severity: medium
    category: code
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:100-102'
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:203-239'
    description: >-
      As máquinas de estado não são protegidas. Pedido 'cancelado' pode ser recebido e dá entrada em
      estoque (sonda 7d). Cotação já 'aprovada' pode ser aprovada de novo e gera um segundo pedido: 3
      pedidos para a mesma OS na sonda 8b. Cotação 'cancelada' também pode ser aprovada (sonda 8d).
    recommendation: >-
      Receber só pedidos em 'pendente'/'aprovado'; aprovar só cotações em 'em_cotacao'/'respondida'
      (ERRCODE P0001).
  - id: QA29-006
    severity: medium
    category: code
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:153-158,234-239'
      - 'src/repositories/mapeadores/compras.js:88-89,146-147'
    description: >-
      As RPCs não gravam os dados que o domínio espera: dataRecebimento/documentoEntrada no pedido e
      fornecedorVencedorId/Nome na cotação. Depois de receber ou aprovar no modo remoto, esses campos
      voltam nulos ou vazios. O teste unitário mocka a RPC devolvendo esses campos, o que esconde a lacuna.
    recommendation: 'Atualizar metadata nas RPCs com jsonb_set/||.'
  - id: QA29-007
    severity: medium
    category: tests
    refs:
      - 'supabase/tests/'
      - 'tests/unit/comprasRepository.test.js:195-300'
    description: >-
      Falta teste SQL (supabase/tests/2.9_*.test.sql) para RLS por papel, janela D4 e comportamento das
      RPCs, embora a seção Testing da story e o DoD ("RLS aplicada e testada") peçam isso. Os testes
      unitários só confirmam o nome e os parâmetros da RPC mockada, e nenhum dos defeitos QA29-003 a 006
      seria pego.
    recommendation: 'Criar 2.9_compras_cotacoes.test.sql no padrão das stories 2.2/2.5/2.15, rodável pelo harness PGlite.'
  - id: QA29-008
    severity: low
    category: code
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:222-224,282'
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:115'
    description: >-
      Quando não vem fornecedor, a RPC escolhe propostas[0] mas insere p_fornecedor_id ('') no pedido,
      o que quebra a FK (sonda 8c). Quantidade decimal no item quebra o cast ::integer (sonda 7f).
    recommendation: "Inserir v_fornecedor->>'id'; validar ou arredondar a quantidade com mensagem clara."
  - id: QA29-009
    severity: low
    category: security
    refs:
      - 'supabase/migrations/20260926190000_compras_cotacoes_e_pedidos.sql:164,304'
      - 'src/repositories/comprasRepository.js:48,145'
    description: >-
      O papel anon tem EXECUTE nas duas RPCs (herdado dos default privileges, confirmado em produção).
      Hoje a checagem de papel bloqueia a chamada, então não há bypass. .or() interpola o id sem escapar
      (injeção de filtro PostgREST, limitada pela RLS). A secretaria também consegue marcar pedido como
      'entregue' por UPDATE direto, sem passar pela RPC e sem Kardex (sonda 11).
    recommendation: >-
      REVOKE EXECUTE ... FROM PUBLIC, anon; validar ou escapar o id (ou usar .eq em duas consultas);
      avaliar trigger que impeça status 'entregue' fora da RPC.
  - id: QA29-010
    severity: low
    category: docs
    refs:
      - 'docs/stories/2.9.migracao-compras-e-cotacoes.md'
    description: >-
      O Dev Agent Record e o DoD não conferem com o código: AC10 "par mobile verificado" sem ligação real;
      DoD "nenhum maior + 1 no front" e "RLS testada" marcados [x]; status parado em Ready, sem as
      transições InProgress/InReview.
    recommendation: 'Corrigir o registro junto com as correções.'

acceptance_criteria:
  AC1: {status: PARTIAL, note: 'Repositório tem as 11 assinaturas com fail-closed (executarRepositorio/executarOperacao), mas nenhuma tela o consome (QA29-001).'}
  AC2: {status: PARTIAL, note: 'Sequence + trigger OK (PED-AAAA-NNN), mas o front segue gerando maior+1 e o banco aceita número do cliente (QA29-002).'}
  AC3: {status: PASS, note: 'Mapeamento explícito CANCELADA<->cancelada no mapeador, testado; o CHECK rejeita maiúsculo.'}
  AC4: {status: FAIL, note: 'RPC atômica existe, mas muda a regra de negócio da OS e não faz a anotação (QA29-003); autoria do Kardex fixa (QA29-004); pedido cancelado pode ser recebido (QA29-005).'}
  AC5: {status: CONCERNS, note: 'Atômica e preserva ordem_servico_ref (sonda 8a), mas aprovação duplicada gera pedidos duplicados (QA29-005).'}
  AC6: {status: PASS, note: 'Sondas: admin total; secretaria S/I/U; DELETE 0 linhas para a secretaria; mecânico/NULL/anon sem acesso.'}
  AC7: {status: PASS, note: 'Fora da janela: INSERT bloqueado, UPDATE 0 linhas, RPCs levantam exceção; admin não é afetado.'}
  AC8: {status: PASS, note: '0 políticas TO anon/public (PGlite e produção).'}
  AC9: {status: CONCERNS, note: 'Testes unitários existem e cobrem o mapeamento e o fail-closed, mas não pegam os defeitos das RPCs (QA29-007).'}
  AC10: {status: FAIL, note: 'MobileComprasPage usa useComprasWorkflow -> comprasData (localStorage); nada a verificar na troca de fonte.'}
  AC11: {status: PASS, note: 'trg_audit_* e trg_set_updated_at_* ativos nas duas tabelas; audit_logs populado.'}
  AC12: {status: PASS, note: 'vitest 362/362, eslint 0 erros, arquivos <= 400 linhas.'}

nfr_validation:
  security: {status: CONCERNS, notes: 'RLS FR25/D4 correta e papel NULL fechado (papel_usuario usa COALESCE para ""); autoria do Kardex forjada; EXECUTE para anon.'}
  performance: {status: PASS, notes: 'Sequences evitam scan; nada relevante.'}
  reliability: {status: FAIL, notes: 'Máquinas de estado sem guarda (duplicidade de pedidos, recebimento de cancelado); regra de OS alterada.'}
  maintainability: {status: CONCERNS, notes: 'Código limpo, mas desconectado da UI e sem teste SQL.'}

recommendations:
  immediate:
    - 'QA29-001/002: ligar as telas (desktop e mobile) ao comprasRepository e remover o maior+1 no modo remoto.'
    - 'QA29-003/004/005/006/008: nova migration corrigindo receber_pedido_compra e aprovar_cotacao_gerar_pedido.'
    - 'QA29-007: teste SQL 2.9 rodável no harness PGlite.'
  future:
    - 'QA29-009: REVOKE EXECUTE de anon; escapar o filtro .or(); bloquear status entregue fora da RPC.'
    - 'Story 2.17: portal público de cotação por token por fornecedor (regressão temporária já declarada).'

waiver: {active: false}
