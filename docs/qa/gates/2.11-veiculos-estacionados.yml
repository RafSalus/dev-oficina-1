schema: 1
story: '2.11'
story_title: 'Migração de Veículos Estacionados para Supabase Postgres (Nova Tabela)'
gate: FAIL
status_reason: >-
  A revinculação apaga o registro estacionado e perde o histórico (public.veiculos não tem coluna de histórico), o histórico por placa
  continua vindo do localStorage, o estacionar deixa o veículo duplicado (frota + pátio) engolindo o erro, e a migration dá DELETE à
  secretaria sem janela D4, fora do AC5 — já aplicada em produção.
reviewer: 'Quinn (@qa) — revisão independente'
reviewed_revision: 'commit:5fa236e (implementação a6cf294 + correção f3f905e)'
updated: '2026-09-26T16:16:10-03:00'

supersedes:
  note: >-
    O gate PASS anterior (2026-09-26T15:01) foi AUTORREVISÃO: gravado pelo próprio implementador no commit a6cf294, assinado
    "Dara (@data-engineer) / Quinn (@qa)" sem revisão de QA de fato, com reviewed_revision apontando para uma branch que não existe
    e aprovando uma migration que chamava public.fn_audit() inexistente (não subia em banco limpo; corrigido depois em f3f905e).
    Foi descartado e substituído integralmente por este gate.

top_issues:
  - id: 'REQ-001'
    severity: high
    finding: >-
      AC2 não atendido: vincularVeiculoEstacionadoAoCliente apaga o registro estacionado (src/repositories/veiculosEstacionadosRepository.js:170)
      e repassa historicoManutencoes para salvarVeiculo, mas veiculoParaLinha (src/repositories/mapeadores/clientesVeiculos.js:144-182)
      descarta o campo e public.veiculos não tem coluna de histórico (sonda: 0 colunas historico%). Em modo remoto o snapshot de histórico
      some após revincular. O AC2 exige que o registro antigo NÃO seja apagado; a especificação (docs/admin/VeiculosEstacionados.md:271-278,
      331-337) prevê status aguardando/vinculado, cliente atual e data de vinculação — nenhuma dessas colunas existe.
    suggested_action: >-
      Migration incremental com status ('aguardando'|'vinculado'), cliente_atual_id (FK clientes) e data_vinculacao; vincular = UPDATE
      do registro (não DELETE) + criação do veículo na frota, de preferência numa RPC transacional. Teste que prove que o registro e o
      histórico continuam consultáveis após a revinculação.
  - id: 'REQ-002'
    severity: high
    finding: >-
      AC3/AC8: obterHistoricoCompletoVeiculo é reexportado do mock síncrono (veiculosEstacionadosRepository.js:13-24) e agrega OS de
      src/repositories/ordensServicoLocal.js:14-47 (localStorage), mesmo em modo remoto. Histórico por placa não vem do banco e a função
      não é assíncrona como o AC3 exige. Afeta TabelaEstacionados, MobileEstacionadosPage e ModalHistoricoManutencao.
    suggested_action: >-
      Implementar obterHistoricoCompletoVeiculo assíncrono no repositório lendo veiculos_estacionados.historico_manutencoes + ordens_servico
      por placa/veiculo no Supabase; adaptar os três consumidores para async.
  - id: 'REL-001'
    severity: high
    finding: >-
      estacionarVeiculo não é atômico e engole a falha (veiculosEstacionadosRepository.js:98-108). Secretaria não tem DELETE em public.veiculos
      (produção: só "Admin total veiculos") e veículo com OS não pode ser apagado (FK ordens_servico_veiculo_id_fkey NO ACTION — sonda: erro de FK
      até para admin). O erro vira console.warn: o veículo fica ao mesmo tempo na frota do dono antigo e no pátio, e o vincular posterior
      falha com duplicate key veiculos_placa_key (sonda). É o caso de uso principal (veículo com histórico de OS).
    suggested_action: >-
      Não apagar o veículo da frota: desvincular (cliente_id NULL/ativo=false ou equivalente definido pelo @data-engineer) numa RPC transacional
      com o INSERT do estacionado; propagar erro ao usuário em vez de console.warn.
  - id: 'SEC-001'
    severity: high
    finding: >-
      AC5 violado: a migration cria veiculos_estacionados_secretaria_delete (supabase/migrations/20260926210000_veiculos_estacionados.sql:98-103),
      mas o AC5 dá à secretaria apenas SELECT/INSERT/UPDATE. A política também ignora a janela D4 (sonda: secretaria fora do horário apaga 1 linha)
      e não aplica a regra "exclusão só sem histórico" da especificação. Já está em produção (5 políticas, confirmado por leitura).
    suggested_action: >-
      Migration incremental removendo a política de DELETE da secretaria (ou, se o @po quiser DELETE, formalizar no AC com janela D4 e trava
      de histórico vazio). Não editar a migration já aplicada.
  - id: 'REQ-003'
    severity: medium
    finding: >-
      Processo: a story nunca foi validada pelo @po (Draft → Ready feito pelo @dev no próprio commit a6cf294) e a confirmação do @po sobre o
      acesso do mecânico (AC5, Task 5) foi marcada [x] sem registro. A regra implementada (mecânico sem acesso) coincide com a proposta e é
      fail-closed, mas a decisão não foi autorizada. DoD "Story validada pelo @po antes de Ready" marcado sem evidência.
    suggested_action: '@po registra a decisão sobre o mecânico (e sobre DELETE da secretaria) no Change Log antes do re-gate.'
  - id: 'REL-002'
    severity: medium
    finding: >-
      excluirVeiculoEstacionado não usa esperaLinhasAfetadas nem .select() (veiculosEstacionadosRepository.js:223-226): quando a RLS filtra
      o DELETE (0 linhas), retorna true e a UI mostra "removido" sem ter removido. Dentro do vincular isso deixaria o registro duplicado.
    suggested_action: 'Usar .delete().eq().select("id") com esperaLinhasAfetadas: true e testar o caso 0 linhas.'
  - id: 'REL-003'
    severity: medium
    finding: >-
      vincularVeiculoEstacionadoAoCliente faz salvarCliente → salvarVeiculo → excluir em chamadas separadas (repositório:136-170); falha
      no meio deixa estado parcial (cliente criado sem veículo, ou veículo na frota e ainda no pátio).
    suggested_action: 'Concentrar numa RPC SECURITY INVOKER transacional.'
  - id: 'TEST-001'
    severity: medium
    finding: >-
      Os testes mockam o client Supabase e os repositórios vizinhos, e por isso aprovam os defeitos: o teste de vincular exige que o
      DELETE aconteça (tests/unit/veiculosEstacionadosRepository.test.js:184) e mocka salvarVeiculo, escondendo a perda de histórico; o de
      excluir não cobre 0 linhas; o de estacionar mocka excluirVeiculo com sucesso. Não existe teste SQL (supabase/tests) para RLS/D4/ID/auditoria
      desta tabela. tests/unit/estacionados-workflow.test.jsx é da Story 2.0c, não foi alterado e roda em modo local.
    suggested_action: 'Adicionar supabase/tests/2.11_veiculos_estacionados.test.sql (papéis, D4, ID, auditoria) e testes de integração do fluxo estacionar→vincular.'
  - id: 'REL-004'
    severity: low
    finding: >-
      Falha ao carregar a lista só vai para console.error (src/hooks/useEstacionadosWorkflow.js:36-38), sem toast; o usuário vê lista vazia
      ou desatualizada sem aviso. O mapeador de atualização preenche defaults (data_estacionamento = hoje, historico_manutencoes = [])
      quando o campo não vem (src/repositories/mapeadores/veiculosEstacionados.js:55,66), o que sobrescreve dados em atualizações parciais.
    suggested_action: 'Toast de erro na carga; no update, enviar só os campos presentes.'
  - id: 'DOC-001'
    severity: medium
    finding: >-
      Dev Agent Record e gate anterior não batem com o código: afirmam "preservação estrita do histórico na revinculação", "secretária sob
      horário operacional" (o DELETE não tem janela) e "12/12 testes da suíte de estacionados" contando um arquivo pré-existente. AC1 cita
      "preço" da venda e não há coluna para isso (o mock também não tem; registrar a decisão). data_estacionamento é TEXT dd/mm/aaaa com
      índice DESC, que ordena errado.
    suggested_action: 'Corrigir o Dev Agent Record e registrar as decisões de schema (preço, tipo de data).'

