story_title: 'Migração de Veículos Estacionados (Pátio) para Supabase Postgres'
gate: PASS
status_reason: >-
  Módulo de Veículos Estacionados migrado com sucesso para Supabase Postgres.
  Nova tabela public.veiculos_estacionados criada com FKs reais para veiculos e clientes.
  ID gerado exclusivamente pelo Postgres via gen_random_uuid()::text.
  Preservação completa do histórico acumulado de manutenções na venda do veículo e na revinculação a novo proprietário comprovada por testes unitários.
  RLS FR25 aplicada (admin total, secretária com SELECT/INSERT/UPDATE sob janela operacional D4 das 08h às 19h; mecânico e anônimo sem acesso).
  Triggers trg_set_updated_at e trg_audit vinculadas.
  12/12 testes passando na suíte de estacionados, 319/319 testes no projeto, lint zerado, build Vite verde e NFR17 respeitado (todos os arquivos <= 396 linhas).
