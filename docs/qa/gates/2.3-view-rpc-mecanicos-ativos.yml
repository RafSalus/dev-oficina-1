status_reason: >-
  Os ACs 1 a 8 foram verificados de forma independente: no harness PostgreSQL 17 (6/6 cenários do dev e 4 de 6 mutações extras do QA
  mortas; as 2 que sobreviveram são lacunas de teste de baixo risco) e no Supabase de produção (teste transacional com exit 0, sem
  resíduos; grants e estado da conta conferidos só com contagens). Nenhum achado bloqueia. O veredito é CONCERNS porque o teste SQL
  escreve em auth.users de produção dentro da transação e a correção de dados em produção não tem script versionado.
