  performance: {status: PASS, notes: 'jsonb_each por UPDATE é O(colunas). O expurgo é mensal e roda sobre created_at. A anonimização só é chamada sob demanda.'}
  reliability: {status: PASS, notes: 'A migration é idempotente (2x no PGlite). O cron é idempotente. As claims malformadas falham fechado, como antes.'}
  maintainability: {status: PASS, notes: 'Ler UPDATE na trilha agora exige combinar diffs (trade-off documentado no ADR). Lista de colunas e identificação de OS unificadas.'}

