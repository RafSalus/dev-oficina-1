evidence:
  commands:
    - cmd: 'npx vitest run'
      result: '45 arquivos, 362/362 testes passando (os testes passam apesar dos defeitos abaixo; ver TEST-001)'
    - cmd: 'npx eslint --quiet src/ tests/'
      result: 'exit 0, sem erros'
    - cmd: 'wc -l (arquivos da story)'
      result: 'maior: levaETrazRepository.js com 368 linhas; todos <= 400 (NFR17 OK)'
    - cmd: 'node scratchpad/pgtest/qa212.mjs (PGlite / PostgreSQL 17, cadeia completa de 19 migrations)'
      result: >-
        A cadeia sobe em banco limpo (depois de f3f905e). Sequences: APOIO-01..03 e LOG-0001. Com seq=99 o próximo código
        vira APOIO-10 por truncamento do lpad (duplicate key); com seq=9999, LOG-10000 vira LOG-1000. Um codigo forjado
        pelo cliente (LOG-0003) é aceito e o nextval seguinte colide (duplicate key). RLS: anon, autenticado sem papel e
        papel inventado ficam com 0 linhas e têm INSERT negado. Mecânico da dupla altera só D1. MECÂNICO SEM FUNCIONÁRIO
        VINCULADO ALTERA D1 E D2. Mecânico com UPDATE em frota_apoio: 0 linhas. Secretaria faz DELETE nas duas tabelas.
        Otimista: o UPDATE com updated_at velho afeta 0 linhas e o status do mecânico é preservado. O banco aceita
        concluido->agendado e status 'voando' (não há CHECK). Auditoria: INSERT e UPDATE registrados com papel.
        O payload real do repositório em atualizarVeiculoApoio(id,{status,emUsoPor}) é
        {"modelo":"","placa":"","ano":null,"cor":null,"km_atual":null,...}. Frota ANTES: Fiorino/QAP0001/2020/Branco/45200/revisado.
        DEPOIS: ""/""/null/null/null/null.
    - cmd: 'npx supabase db query --linked (somente leitura, produção "Oficina")'
      result: >-
        Migration 20260926220000 aplicada: 2 tabelas, 8 policies e 6 triggers (trg_audit -> fn_audit_trigger). As duas
        tabelas estão com 0 linhas, então ainda não houve perda de dados reais. A policy deslocamentos_mecanico_update
        contém o ramo "IS NULL" (fail-open ativo em produção). fn_gerar_codigo_* sem search_path fixo.

top_issues:
  - id: 'DATA-001'
    severity: high
    finding: >-
      Iniciar, finalizar ou cancelar um deslocamento apaga os dados do veículo de apoio. levaETrazRepository.js:95
      mapeia o objeto parcial {status, emUsoPor} com mapearFrotaApoioParaDb (mapeadores/levaETraz.js:27-37), que
      preenche os ausentes com modelo '', placa '' e ano/cor/km_atual/observacoes NULL e faz UPDATE de todas as colunas.
      Chamadas em :248, :303 e :338. Comprovado no PGlite e ausente do modo local (o mock faz merge).
    suggested_action: >-
      Criar um patch parcial (só as chaves presentes) para UPDATEs de status, ou um mapeador de patch. De preferência,
      mover a transição deslocamento+veículo para uma RPC transacional. Teste que assere o payload enviado a frota_apoio.
  - id: 'DATA-002'
    severity: high
    finding: >-
      O cadastro da frota perde nome e tipo. ModalVeiculoApoio.jsx:81-88 envia {nome, tipo, ...}, mas o schema e o
      mapeador usam modelo e não têm tipo (mapeadores/levaETraz.js:28, 6-22). O payload real grava modelo ''. A aba
      Frota (AbaFrotaApoio.jsx:48-50) e o seletor de apoio (SecaoEquipeApoio.jsx:96,104) exibem v.nome e v.tipo, que
      ficam vazios.
    suggested_action: 'Alinhar os nomes do domínio (nome/tipo) com o schema (coluna tipo + mapeamento nome<->modelo) e testar o round-trip com o payload real do formulário.'
  - id: 'DATA-003'
    severity: high
    finding: >-
      8 campos do deslocamento se perdem no round-trip do mapeador: cidade, idaEVolta, horarioSaidaPrevisto,
      horarioRetornoPrevisto, tempoRealMinutos, tipoCobranca, valorTaxa e observacoesRetorno. O schema usa
      horario_previsto, cobrar_cliente e valor_cobrado, que o formulário não envia. A UI exibe esses campos
      (TabelaDeslocamentos.jsx:182,196,208; ModalDetalhesDeslocamento.jsx:44,163-165,315,329; DeslocamentoCardMobile.jsx:138),
      então a taxa aparece como "R$ undefined" e a mensagem de WhatsApp sai com previsão "undefined". Regressão em
      relação ao localStorage (AC3/AC5).
    suggested_action: 'Mapear 1:1 todos os campos que ModalNovoDeslocamento e ModalFinalizarDeslocamento produzem. Teste de round-trip com o objeto real do formulário.'
  - id: 'SEC-001'
    severity: high
    finding: >-
      Fail-open na policy deslocamentos_mecanico_update (migration :210 e :218). Com "funcionario_atual_id() IS NULL OR
      ...", um usuário com papel mecanico sem funcionário ativo vinculado (desligado/inativo ou conta sem vínculo) altera
      QUALQUER deslocamento. Comprovado: 1 linha em D2, que não é da sua dupla. Está ativo em produção. É o mesmo padrão
      de SEC-001 da 2.2b.
    suggested_action: 'Remover o ramo IS NULL (exigir vínculo), migration corretiva e teste SQL em supabase/tests cobrindo mecânico sem vínculo, fora da dupla e sem papel.'
  - id: 'REQ-001'
    severity: high
    finding: >-
      AC10 não implementado. src/pages/mecanico/components/MecanicoLevaETraz.jsx:1 continua com
      SERVICOS_LEVA_E_TRAZ = [] fixo e não consome o repositório, apesar de as Dev Notes exigirem explicitamente. O
      mecânico em campo (FR19) não tem como ver nem atualizar o deslocamento. O gate anterior declarou "validado".
    suggested_action: 'Ligar MecanicoLevaETraz ao repositório (listar os da dupla e iniciar/finalizar com updatedAt) e cobrir com teste.'
  - id: 'REQ-002'
    severity: high
    finding: >-
      A dupla nunca é gravada. ModalNovoDeslocamento.jsx:196-197 envia só motoristaPrincipalNome/auxiliarNome (com
      fallback fixo 'Marcos Aurélio', já que MOTORISTAS_PADRAO = []), nunca motoristaPrincipalId/auxiliarId, nem
      veiculoId. As FKs do AC2 ficam sempre NULL e a regra de "próprios registros" do AC7 nunca casa: só o ramo fail-open
      de SEC-001 deixa o mecânico atualizar alguma coisa.
    suggested_action: 'Selecionar a dupla a partir de obter_mecanicos_ativos() (Story 2.3) e gravar os ids; o mesmo para veiculo_id.'
  - id: 'REQ-003'
    severity: medium
    finding: >-
      A RLS de frota_apoio diverge do AC7: o mecânico tem só SELECT (migration :164-169), mas o AC exige
      SELECT/INSERT/UPDATE. Consequência: quando o mecânico inicia/finaliza, a atualização do veículo afeta 0 linhas, vira
      CONFLITO_EDICAO e é engolida com console.warn (repositório :251, :303, :341). O veículo fica "disponivel" mesmo em rota.
    suggested_action: 'Conceder UPDATE restrito (status/em_uso_por/km_atual) ao mecânico da dupla, preferencialmente dentro da RPC de transição.'
  - id: 'REL-001'
    severity: medium
    finding: >-
      lpad trunca códigos. migration :32 lpad(n,2) e :97 lpad(n,4): o 100º veículo recebe APOIO-10 e o 10000º
      deslocamento recebe LOG-1000, o que gera duplicate key (comprovado). A partir daí o INSERT fica bloqueado de forma
      permanente.
    suggested_action: "Usar lpad só quando length(n) < largura (ex.: CASE WHEN n < 10^w THEN lpad(...) ELSE n::text END ou to_char com FM)."
  - id: 'REL-002'
    severity: medium
    finding: >-
      O código aceita valor do cliente (migration :31 e :96, "IF NEW.codigo IS NULL"). Qualquer papel com INSERT pode
      forjar LOG-xxxx/APOIO-xx, o que quebra a garantia do AC4 ("gerados exclusivamente por sequence") e provoca colisão
      futura com o nextval (comprovado). O UPDATE também permite reescrever o codigo.
    suggested_action: 'Sempre sobrescrever NEW.codigo no INSERT e bloquear a alteração de codigo no UPDATE (trigger ou revogar a coluna).'
  - id: 'REL-003'
    severity: medium
    finding: >-
      A transição não é atômica. Deslocamento e veículo de apoio são gravados em 2 requisições e a falha da segunda é
      engolida (repositório :247-254, :295-306, :337-344). O veículo de apoio é atualizado sem updated_at, ou seja, sem
      controle otimista, e o fallback "updatedAtLido || atual.updatedAt" (:244, :292, :334) faz a checagem contra a
      linha recém-lida quando o chamador não informa a versão.
    suggested_action: 'RPC SECURITY INVOKER única por transição (ou tratar e exibir a falha); exigir updatedAt do chamador.'
  - id: 'TEST-001'
    severity: medium
    finding: >-
      Os testes não pegariam nenhum dos defeitos acima. tests/unit/levaETrazRepository.test.js não assere os payloads
      enviados (update em frota_apoio só verifica toHaveBeenCalled, :184 e :236), usa o campo modelo que a UI não usa
      (:259), não testa cancelarDeslocamento, não testa CONFLITO_EDICAO nas transições (só em atualizar direto) e não há
      teste SQL de RLS/sequence em supabase/tests para a 2.12.
    suggested_action: 'Asserções de payload, round-trip com objetos reais dos formulários, teste SQL transacional (padrão 2.15) com os casos de RLS/código acima.'
  - id: 'DOC-001'
    severity: medium
    finding: >-
      O Dev Agent Record e o gate anterior superestimam a entrega: AC10 "validado" sem mudança; páginas LevaETrazPage,
      MobileLevaETrazPage e MecanicoLevaETraz e o teste leva-e-traz-workflow.test.jsx (existente desde a 2.0c) listados
      como escopo sem alteração; "secretaria e mecânico sob regra de dupla" (a secretaria não tem regra de dupla);
      autorrevisão assinada como @data-engineer/@qa; status deixado em Ready em vez de InReview.
    suggested_action: 'Corrigir o Dev Agent Record na volta ao InProgress; gate só por revisor independente.'
  - id: 'REL-004'
    severity: low
    finding: >-
      excluirDeslocamento/excluirVeiculoApoio (repositório :122-125, :357-360) não usam esperaLinhasAfetadas. A exclusão
      negada pela RLS ou de id inexistente retorna true e a UI exibe "removido com sucesso".
    suggested_action: "Usar .delete().eq(...).select() com esperaLinhasAfetadas: true."
  - id: 'REQ-004'
    severity: low
    finding: 'A secretaria tem DELETE nas duas tabelas (policies FOR ALL em :156-162 e :180-186), mas o AC7 fala em SELECT/INSERT/UPDATE para a secretaria. A tela desktop oferece exclusão.'
    suggested_action: '@po decidir; se for mantido, registrar a exceção no AC7.'
  - id: 'MNT-001'
    severity: low
    finding: >-
      Faltam CHECK em status/tipo_servico/prioridade (o banco aceitou 'voando' e concluido->agendado). fn_gerar_codigo_*
      estão sem SET search_path (lint do Supabase). A mensagem de CONFLITO_EDICAO não orienta a recarregar (risco citado na
      story) e 0 linhas por RLS também vira CONFLITO_EDICAO.
    suggested_action: 'CHECKs com os valores do mock; SET search_path = ''''; mensagem "recarregue e tente novamente".'

