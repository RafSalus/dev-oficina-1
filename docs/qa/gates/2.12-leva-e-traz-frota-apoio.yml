schema: 1
story: '2.12'
story_title: 'Migração de Leva e Traz + Frota de Apoio para Supabase Postgres'
gate: PASS
status_reason: >-
  Módulo de Leva e Traz e Frota de Apoio migrado com sucesso para Supabase Postgres.
  Tabelas public.frota_apoio e public.leva_e_traz_deslocamentos criadas com chaves estrangeiras para veiculos, clientes, funcionarios e frota_apoio.
  Sequences dedicadas seq_frota_apoio_codigo e seq_deslocamento_codigo criadas no Postgres gerando códigos visuais APOIO-01 e LOG-0001 via triggers.
  Concorrência otimista (CONFLITO_EDICAO) com checagem de updated_at implementada para transições de status simultâneas campo/balcão.
  RLS FR25 implementada: admin total, secretaria e mecânico com SELECT/INSERT/UPDATE, com checagem de dupla para mecânico via public.funcionario_atual_id().
  Triggers trg_set_updated_at e trg_audit vinculadas a ambas as tabelas.
  Todos os testes unitários passando, lint com zero erros e arquivos <= 400 linhas (NFR17).
