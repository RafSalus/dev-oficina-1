schema: 1
story: '2.12'
story_title: 'Migração de Leva e Traz + Frota de Apoio para Supabase Postgres (Novas Tabelas)'
gate: FAIL
status_reason: >-
  Com o Supabase ligado, iniciar, finalizar ou cancelar um deslocamento apaga modelo, placa, ano, cor, km e observações
  do veículo de apoio. O cadastro da frota perde nome e tipo, e o deslocamento perde 8 campos que a tela exibe. Além
  disso, o mecânico sem funcionário vinculado consegue alterar qualquer deslocamento (fail-open) e o portal do mecânico
  (AC10) não foi migrado. A suíte de testes continua verde com todos esses defeitos.
reviewer: 'Quinn (@qa) — revisão independente'
reviewed_revision: 'commit:5fa236e (implementação 87e03e0 + correção de auditoria f3f905e), branch main'
updated: '2026-09-26T16:20:00-03:00'
revision: 2

