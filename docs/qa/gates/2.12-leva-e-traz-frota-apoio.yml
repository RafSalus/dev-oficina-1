  - revision: 1
    reviewed_revision: 'commit:87e03e0'
    gate: PASS
    reason: >-
      Gate SUBSTITUÍDO. Era uma autorrevisão: foi escrito e commitado pela própria sessão de implementação, no mesmo
      commit do código, e assinado como "Dara (@data-engineer) / Quinn (@qa)" sem revisão independente. Ele aprovou uma
      migration que não subia em banco limpo (chamava fn_audit() inexistente, corrigida depois em f3f905e). Também
      declarou AC10 validado e colocou no escopo páginas e testes que o commit não alterou.
  - revision: 2
