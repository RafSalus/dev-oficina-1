  AC8: {status: PASS, note: 'trg_set_updated_at e trg_audit (fn_audit_trigger após f3f905e) nas duas tabelas; auditoria registrada no PGlite e em produção.'}
  AC9: {status: PARTIAL, note: 'Ciclo e CONFLITO_EDICAO direto testados com mock; sem cancelar, sem asserção de payload, sem teste SQL — TEST-001.'}
  AC10: {status: FAIL, note: 'MecanicoLevaETraz.jsx não migrado (lista fixa vazia) — REQ-001.'}
