story: '2.8'
story_title: 'Migração de Estoque e Movimentações (Kardex) para Supabase Postgres'
gate: PASS
status_reason: >-
  Kardex e movimentações de estoque migrados para o Supabase Postgres com transacionalidade atômica via RPC registrar_movimentacao_estoque.
  Trigger trg_before_update_pecas_estoque protege contra alteração manual de saldo fora do Kardex (ADR-005 §2.5).
  Índice parcial único previne saída duplicada para o mesmo item de OS.
  RLS FR25 aplicada (Secretaria sob em_horario_operacional(), mecânicos sem acesso direto D5).
  Fail-closed implementado, 286/286 testes passando no Vitest, lint zerado e NFR17 respeitado (< 270 linhas em todos os arquivos).
reviewer: 'Dara (@data-engineer) / Quinn (@qa)'
