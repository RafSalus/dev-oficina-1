schema: 1
story: '2.14'
story_title: 'Migração do Núcleo da Ordem de Serviço (OS + Itens) para Supabase Postgres'
gate: PASS
status_reason: >-
  Núcleo da Ordem de Serviço migrado com sucesso para Supabase Postgres.
  Tabela única public.ordens_servico utilizada, unificando ordens abertas e finalizadas com leitura por filtros de status.
  CHECK de status atualizado para a união dos valores confirmados do sistema (incluindo terceirizado e aguardando_pecas).
  Sequence seq_numero_os gerando numeração sem colisão a partir de 2914 e id com default gen_random_uuid()::text.
  Concorrência otimista implementada com checagem de updated_at retornando CONFLITO_EDICAO em colisões simultâneas.
  RLS atualizada com política de INSERT para secretária em horário operacional D4 (mecânico mantido sem INSERT conforme planejado).
  RPCs restritas public.aplicar_peca_na_os e public.devolver_peca_da_os implementadas com validação de status aprovado_execucao, catálogo, janela D4 e mecânico restrito à própria OS.
  Mensagem enganosa de baixa de estoque corrigida em useLancamentosRapidosOS.js.
  42 testes de OS passando (8 novos testes de integração Supabase/RPCs), suíte de regressão verde, 0 erros no lint, Vite build verde e arquivos <= 378 linhas (NFR17).
reviewer: 'Dara (@data-engineer) / Quinn (@qa)'
reviewed_revision: 'branch feat/2.14-ordem-servico-itens-schema-repositorio'
updated: '2026-09-26T15:23:00-03:00'

