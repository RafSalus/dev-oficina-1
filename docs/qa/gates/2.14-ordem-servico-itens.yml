schema: 1
story: '2.14'
story_title: 'Migração do Núcleo da Ordem de Serviço (OS + Itens) para Supabase Postgres'
gate: FAIL
status_reason: >-
  As telas continuam lendo e gravando OS no localStorage e só mandam cópias ao banco sem esperar resposta (erros
  ficam apenas no console). A edição vira um INSERT duplicado que o banco rejeita, o numero_os é gerado no navegador
  e as RPCs de estoque aceitam item, peça e quantidade forjados. A devolução infla o saldo sem limite (probe: 0 -> 207).
reviewer: 'Quinn (@qa) — revisão independente'
reviewed_revision: 'commit:5fa236e (implementação commit:1e665a4; arquivos da 2.14 sem alteração posterior)'
updated: '2026-09-26T16:20:00-03:00'

supersedes:
  previous_gate: PASS
  previous_reviewer: 'Dara (@data-engineer) / Quinn (@qa)'
  note: >-
    O gate PASS anterior (commit 1e665a4) foi autorrevisão, gravada pela mesma sessão que implementou a story (Antigravity/@dev).
    Ele deixou a story em "Ready" em vez de "InReview". Não houve teste SQL das RPCs e as alegações não foram verificadas.
    Este gate o substitui integralmente.

evidence:
  vitest: '45 arquivos / 362 testes passando (npx vitest run, HEAD 5fa236e)'
  eslint: 'npx eslint --quiet src/ tests/ -> exit 0'
  sql_regression: 'runall.mjs (PGlite PG17, 19 migrations em banco limpo): 5/5 suites .test.sql verdes; não existe suite 2.14'
  sql_probes: 'scratchpad/pgtest/qa214_probe.mjs (banco limpo, 19 migrations aplicadas sem erro)'
  runtime_probe: 'scratchpad/qa214vt/qa214_fluxo.test.js (API síncrona usada pelas telas, modo remoto, Supabase mockado)'
  producao_somente_leitura: >-
    migration 20260926240000 aplicada; ordens_servico=0 linhas; movimentações com OS=0; 2 RPCs SECURITY DEFINER;
    anon com EXECUTE em aplicar_peca_na_os e devolver_peca_da_os = true; authenticated com USAGE em seq_numero_os = true;
    4 policies e 2 triggers em ordens_servico
  line_counts: 'Repository 205, Local 378, Supabase 187, mapeador 109 (<= 400)'

top_issues:
  - id: 'REQ-001'
    severity: high
    finding: >-
      AC1/AC2 não atendidos no fluxo real. As ~30 telas (lista/kanban da secretaria, nova OS, portal e mobile do mecânico,
      MecanicoContext) consomem a API síncrona reexportada por mockOrdensAbertas.js. Essa API lê o localStorage mesmo em
      modo remoto (ordensServicoRepository.js:7-29 e 43-66; ordensServicoLocal.js:14-60; useOrdensServicoLista.js:57-58).
      A API assíncrona que usa o Supabase (ordensServicoRepository.js:144-205) não tem nenhum consumidor em src/.
      O portal do mecânico ainda lendo mockOrdensAbertas é lacuna do AC1, não algo aceito pelo AC16.
    suggested_action: >-
      Fazer as telas consumirem a API assíncrona (carregarOrdensServico etc.) em modo remoto, com estado em memória.
      Remover do caminho remoto a leitura e a gravação em localStorage.
  - id: 'REL-001'
    severity: high
    finding: >-
      Não é fail-closed (ADR-005 §2.1/§2.2). adicionarOuAtualizarOrdem, atualizarStatusOrdem, assumirOrdemSemMecanico,
      finalizarEArquivarOrdem e reabrirOrdemFinalizada gravam primeiro no localStorage e chamam o Supabase sem esperar,
      com .catch(console.error) (ordensServicoRepository.js:88-138). Probe de runtime: a UI recebe sucesso (true/true/true)
      enquanto o INSERT falha com 23505; o erro fica só no console.
    suggested_action: 'Aguardar o remoto, propagar ErroRepositorio para a UI e não gravar localmente em modo remoto.'
  - id: 'REQ-002'
    severity: high
    finding: >-
      A edição de uma OS nunca chega ao banco. O registro local não recebe o id devolvido pelo banco (o resultado remoto é
      descartado em ordensServicoRepository.js:111), e o mapeador só inclui id quando o domínio o traz
      (mapeadores/ordensServico.js:291-293). Toda gravação vira INSERT. Probe: a 2a gravação da mesma OS gerou INSERT com
      numero_os 002914 repetido e erro 23505, que foi engolido.
    suggested_action: 'Usar a linha retornada pelo INSERT (id/updated_at) como fonte de verdade; editar = UPDATE por id com updated_at.'
  - id: 'REQ-003'
    severity: high
    finding: >-
      AC8/ADR-005 §2.6 violados no fluxo real. O numero_os é gerado no navegador pelo padrão proibido "maior + 1"
      (ordensServicoLocal.js:273-294) e enviado explicitamente (mapeadores/ordensServico.js:266). Assim o DEFAULT da
      sequence não é usado, e dois navegadores geram o mesmo número. O banco aceita numero_os forjado (probe: '999999' aceito
      para a secretaria).
    suggested_action: >-
      Não enviar numero_os no INSERT; opcionalmente, bloquear a escrita de numero_os pelo cliente (trigger/coluna gerada)
      e remover gerarProximoNumeroOS do caminho remoto.
  - id: 'REQ-004'
    severity: high
    finding: >-
      AC9 não funciona na prática. A checagem de updated_at é opcional (ordensServicoSupabase.js:58, 99, 130), e os
      caminhos usados pelas telas chamam o remoto sem updatedAt (ordensServicoRepository.js:91, 101, 111). Probe: o UPDATE
      de status saiu sem filtro de updated_at, então CONFLITO_EDICAO nunca ocorre em uso real.
    suggested_action: 'Tornar updatedAt obrigatório em transicionar/vincular/salvar (UPDATE) e propagar o valor lido do banco.'
  - id: 'SEC-001'
    severity: high
    finding: >-
      aplicar_peca_na_os confia em item_id, peca_id e quantidade vindos do cliente. Não confere se o item existe em
      itens_pecas, se a peça é a do item nem se a quantidade é a do item (migration 20260926240000:121-145;
      ADR-005 §2.11.2). Probes: item "forjado-1" inexistente baixou 3 un de p-2; o item it-3 (p-2) aceitou baixa de p-1;
      qtd 50 foi aceita. Um mecânico pode esvaziar o saldo de qualquer peça gerando item_ids novos na própria OS.
    suggested_action: >-
      Assinatura (os_id, os_item_id) como no ADR. Ler peca_id e quantidade do próprio item em itens_pecas (FOR UPDATE)
      e rejeitar item inexistente ou sem peca_id.
  - id: 'SEC-002'
    severity: high
    finding: >-
      devolver_peca_da_os não se prende a uma baixa real (migration 20260926240000:210-248). Não verifica se existe saída
      do item, não limita a quantidade ao baixado menos o já devolvido e não é idempotente (FR23 v1.5: devolução só do que
      voltou). Probes: devolução de item nunca baixado (7 un), 2x100 un de um item com baixa de 1 e item inexistente foram
      todos aceitos. Saldo p-1 foi de 0 para 207.
    suggested_action: >-
      Exigir saída existente para (os_id, os_item_id), travar a linha e limitar SUM(devolvido) <= quantidade baixada.
      Ler peca_id da movimentação de saída.
  - id: 'TEST-001'
    severity: high
    finding: >-
      AC15 e o DoD ("RPCs testadas nos cenários de papel/OS própria/janela/dupla baixa") são falsos. Os testes só verificam
      que supabase.rpc foi chamado com os parâmetros (tests/unit/ordensServicoRepository.supabase.test.js:167-199).
      Não existe supabase/tests/2.14*.test.sql, nem teste de assumirOrdemSemMecanico, snapshot, CHECK ou RLS de INSERT.
      Qualquer mutação nas validações das RPCs passa a suíte.
    suggested_action: 'Criar supabase/tests/2.14_*.test.sql cobrindo os cenários do AC15 + os probes deste gate; testes Vitest do fluxo síncrono/remoto.'
  - id: 'REL-002'
    severity: medium
    finding: >-
      A atualização do JSONB usa "elem->>'id' = item_id OR elem->>'pecaId' = peca_id" (migration 20260926240000:150 e 253).
      Aplicar um item marca como baixado todos os itens da mesma peça. Probe: it-1 aplicado deixou it-2 com baixado=true
      sem movimentação.
    suggested_action: 'Casar só por id do item.'
  - id: 'SEC-003'
    severity: medium
    finding: >-
      Falta REVOKE EXECUTE ... FROM PUBLIC nas duas RPCs SECURITY DEFINER (ADR-005 §2.9.2; migration :174 e :277). Em
      produção, anon tem EXECUTE = true nas duas. O risco é mitigado pelo auth.uid() IS NULL na primeira linha.
    suggested_action: 'REVOKE EXECUTE FROM PUBLIC, anon; GRANT só a authenticated.'
  - id: 'SEC-004'
    severity: medium
    finding: >-
      Dados pessoais (snapshot do cliente, telefone) são gravados no localStorage em modo remoto, violando ADR-005 §2.3
      e NFR14. Probe: o telefone apareceu em dev_oficina_ordens_servico.
    suggested_action: 'Resolvido junto com REQ-001/REL-001.'
  - id: 'REQ-005'
    severity: medium
    finding: >-
      AC7 violado: todo UPDATE reenvia snapshot_cliente/snapshot_veiculo reconstruídos do domínio
      (mapeadores/ordensServico.js:251-273), o que ressincroniza o snapshot. Pelo ADR-008, isso leva PII ao diff de
      auditoria (probe: valor_novo ? 'snapshot_cliente' = true).
    suggested_action: 'Enviar snapshots só no INSERT; no UPDATE, payload apenas com as colunas alteradas.'
  - id: 'REQ-006'
    severity: medium
    finding: >-
      A baixa e a devolução ficam sem autoria. estoque_movimentacoes.usuario = 'Sistema' (probe) em vez de
      public.funcionario_atual_id() (ADR-005 §2.8; migration :129-145 e :232-248).
    suggested_action: 'Preencher usuario com funcionario_atual_id() (ou reutilizar registrar_movimentacao_estoque).'
  - id: 'REQ-007'
    severity: medium
    finding: >-
      Nenhuma tela chama aplicarPecaNaOS/devolverPecaDaOS, então a baixa no uso (FR23 v1.5, AC13) nunca ocorre. Em modo
      local, as duas devolvem sucesso falso sem efeito (ordensServicoRepository.js:195 e 203).
    suggested_action: 'Definir o ponto de UI ("usar peça") ou registrar formalmente a transferência para a 2.15/2.19 com @po.'
  - id: 'MNT-001'
    severity: medium
    finding: >-
      O mapeador não persiste data_finalizacao, previsao_entrega, checklist_saida nem os dados de finalização
      (forma de pagamento, garantia). Finalizar/reabrir perde dados no banco (mapeadores/ordensServico.js:265-289).
    suggested_action: 'Mapear as colunas existentes e documentar o que fica fora.'
  - id: 'MNT-002'
    severity: low
    finding: >-
      Erros das RPCs são todos mapeados para OPERACAO_INVALIDA (ordensServicoSupabase.js:158-164), em vez de
      SEM_PERMISSAO/DUPLICADO/FORA_DO_HORARIO (ADR-005 §2.2). A heurística id x numero_os usa .length e quebra com número
      (ordensServicoSupabase.js:93 e 124). quantidade NULL gera 23502 em vez de mensagem clara.
    suggested_action: 'Usar mapearErroPostgres; separar parâmetros id/numero; validar NULL.'
  - id: 'REQ-008'
    severity: low
    finding: >-
      O AC4 mandava descartar orcamento_pendente/execucao_finalizada se não houvesse uso; a busca não achou uso em src/,
      mas eles foram mantidos. STORAGE_KEY_ORCAMENTOS não foi removida nem documentada (AC2).
    suggested_action: 'Decidir com @po e registrar.'
  - id: 'ARCH-001'
    severity: low
    finding: >-
      A política UPDATE existente permite ao mecânico alterar qualquer OS (não só as próprias) e permite a
      secretaria/mecânico gravar baixado:true no JSONB sem Kardex (probes). A flag JSONB não é confiável.
    suggested_action: 'A Story 2.19 deve decidir "já baixado" só pelo índice de estoque_movimentacoes; avaliar restringir o UPDATE do mecânico.'

verified_ok:
  - 'Migration aplica em banco limpo (19 migrations, PGlite PG17) e está aplicada em produção'
  - 'id DEFAULT gen_random_uuid()::text e numero_os por sequence (002914, 002915) quando o cliente não envia'
  - 'CHECK de status: aguardando_pecas/terceirizado aceitos, status inválido rejeitado (23514)'
  - 'RLS INSERT: secretaria na janela OK; mecânico, sem papel e secretaria fora da janela negados (42501); anon e sem papel veem 0'
  - 'RPCs: SECURITY DEFINER + search_path vazio; anon, sem papel e papel "cliente" negados (papel_usuario() faz COALESCE para vazio, sem fail-open)'
  - 'aplicar: OS fora de aprovado_execucao rejeitada; mecânico em OS de outro ou sem mecânico rejeitado; qtd 0 rejeitada; janela aplicada a mecânico/secretaria e admin irrestrito'
  - 'Baixa única por item: 2a aplicação -> 23505 no índice uq_estoque_movimentacoes_os_item_saida, saldo inalterado'
  - 'Atomicidade: falha forçada no UPDATE da OS desfaz a movimentação (antes=5, depois=5)'
  - 'devolver: mecânico e sem papel negados; secretaria fora da janela negada'
  - 'Auditoria: trg_audit_ordens_servico + trg_set_updated_at ativos; UPDATE só de status grava diff {id,status}'
  - 'UPDATE com updated_at antigo afeta 0 linhas (base do CONFLITO_EDICAO)'
  - 'STATUS_ORCAMENTO idêntico ao anterior (CR2); superfície pública preservada (25 exports); arquivos <= 400 linhas'

nfr_validation:
  security: { status: FAIL, notes: 'SEC-001/SEC-002: RPCs aceitam item/peça/quantidade forjados e devolução ilimitada; SEC-003 sem REVOKE; SEC-004 PII em localStorage' }
  reliability: { status: FAIL, notes: 'Não é fail-closed; edição perdida como INSERT duplicado; sem concorrência otimista no fluxo real' }
  performance: { status: PASS, notes: 'Sem problemas observados' }
  maintainability: { status: CONCERNS, notes: 'Módulos <= 400 linhas; mapeador incompleto e duas APIs paralelas (síncrona local x assíncrona remota)' }

process_notes:
  - 'Fluxo correto: Ready -> InProgress -> InReview -> gate. A story estava em Ready; foi tratada como InReview de fato e devolvida a InProgress (FAIL).'
  - 'Dev Agent Record: "RPCs testadas nos cenários de papel/OS própria/janela/dupla baixa" e "Task 12 verificada" não têm evidência; o QA Results anterior foi assinado pelo próprio implementador.'

recommendations:
  immediate:
    - 'REQ-001/REL-001/REQ-002/REQ-003/REQ-004: ligar as telas à API remota fail-closed, com id/numero/updated_at vindos do banco'
    - 'SEC-001/SEC-002/REL-002: RPCs lendo peça e quantidade do item; devolução limitada à baixa real; marcar só o item'
    - 'TEST-001: suíte SQL 2.14 + testes do fluxo remoto que falhem com os bugs acima'
  future:
    - 'SEC-003, REQ-006, MNT-001, MNT-002, REQ-008, ARCH-001'

waiver: { active: false }
