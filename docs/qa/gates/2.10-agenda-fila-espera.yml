schema: 1
story: '2.10'
story_title: 'Migração da Agenda Dinâmica e Fila de Espera para Supabase Postgres'
gate: FAIL
status_reason: >-
  O banco (tabelas, FKs, RLS, triggers e RPC) sobe e se comporta como descrito, mas a integração com as
  telas não entrega o AC4/AC5/AC6/AC10: a Fila de Espera nunca é gravada no banco pela UI, a cascata de
  atrasos sempre falha com CONFLITO_EDICAO por comparar updated_at como texto, e a edição de agendamento
  não envia updated_at (a concorrência otimista não roda); o hook grava primeiro no localStorage e engole
  falhas remotas, contrariando o fail-closed do ADR-005.
reviewer: 'Quinn (@qa) — revisão independente'
reviewed_revision: 'commit:5fa236e (implementação fd524e8 + correção f3f905e)'
updated: '2026-09-26T16:40:00-03:00'

gate_anterior:
  gate: PASS
  observacao: >-
    Substituído. O gate anterior (assinado "Dara (@data-engineer) / Quinn (@qa)", revisão
    "branch feat/2.10-agenda-fila-espera-schema-repositorio") foi escrito pela própria sessão que
    implementou a story (autorrevisão) e aprovou uma migration que não subia num banco limpo
    (fd524e8 chamava public.fn_audit_log(), inexistente; corrigido depois em f3f905e). Não deve ser usado
    como evidência.

top_issues:
  - id: 'REQ-002'
    severity: high
    finding: >-
      A Fila de Espera não é persistida no banco pela UI. Inserir/remover da fila (desktop e mobile) passa
      por workflow.atualizarFila, que só grava localStorage (src/hooks/useAgendaWorkflow.js:301-304;
      src/hooks/useFilaEsperaWorkflow.js:88-90; src/components/agenda/fila/ModalInserirFila.jsx:76;
      src/pages/dashboard/agenda/mobile/MobileAgendaFilaFormModal.jsx:89). criarItemFilaEspera e
      atualizarItemFilaEspera não têm consumidor. NovaOrdemServicoModal.jsx:84-91 ainda remove da fila via
      agendaData (localStorage). Em modo remoto, o item some ao recarregar (a carga remota substitui a lista).
    suggested_action: >-
      Trocar atualizarFila(lista) por ações por linha (criarItemFilaEspera / excluirItemFilaEspera /
      atualizarItemFilaEspera com updatedAt) no hook, no fluxo de remoção da Nova OS e nos dois modais.
  - id: 'REL-002'
    severity: high
    finding: >-
      A RPC aplicar_cascata_atrasos_agenda compara v_reg.updated_at::text com a string recebida
      (supabase/migrations/20260926200000_agenda_e_fila_espera.sql:141). O cliente envia o valor que o
      PostgREST devolve (ISO 8601: "2026-09-26T19:15:12.697+00:00"), e o ::text do Postgres é
      "2026-09-26 19:15:12.697+00". Sonda no PGlite: com o updated_at atual e correto no formato do PostgREST,
      a RPC lança "Conflito de edição" em todos os casos. Além disso o hook envia a lista inteira, com todos
      os mecânicos (useAgendaWorkflow.js:289-296), e nunca atualiza o estado com os updated_at novos, e
      qualquer id criado no front que não foi para o banco derruba a cascata inteira (P0002).
    suggested_action: >-
      Comparar como timestamptz (v_reg.updated_at <> (v_item->>'updated_at_lido')::timestamptz) e exigir
      updated_at_lido (NULL = erro, não "pula a checagem"). Enviar à RPC só os itens alterados do mecânico e
      recarregar a lista após sucesso. Cobrir com teste SQL.
  - id: 'REL-003'
    severity: high
    finding: >-
      A concorrência otimista não roda na edição real: useAgendamentoFormWorkflow.js:209-231 monta o
      agendamento sem updatedAt, e o hook repassa agendamentoSalvo.updatedAt (undefined) a
      atualizarAgendamento, que então omite .eq('updated_at') (src/repositories/agendaRepository.js:94-96).
      O mesmo objeto não traz os campos de cascata, e o mapeador os regrava como false/0/padrão
      (src/repositories/mapeadores/agenda.js:70-77): editar um agendamento empurrado apaga o estado da cascata.
    suggested_action: >-
      Propagar updatedAt (e os campos de cascata) do agendamento em edição. Tornar updatedAtLido obrigatório
      em atualizarAgendamento/atualizarItemFilaEspera no modo remoto (ADR-005 §2.7: "todo UPDATE").
  - id: 'ARCH-001'
    severity: high
    finding: >-
      O hook não é fail-closed e o id continua sendo gerado no front. Em modo remoto ele grava localStorage e
      o estado antes do banco e dispara a gravação sem await; a falha vira só um toast e a tela fica
      divergente (useAgendaWorkflow.js:240-273, 285-299). Na carga, mostra primeiro o localStorage e engole
      erro remoto com .catch(() => {}) (useAgendaWorkflow.js:139-168, 331-334). Os ids vêm do front
      (useAgendamentoFormWorkflow.js:210 `ag-${Date.now()}`, useAgendaWorkflow.js:59,
      useFilaEsperaWorkflow.js:46) e o mapeador os envia no INSERT (mapeadores/agenda.js:80,131); sonda
      confirmou que o banco aceita id 'ag-1727380000000'. Viola AC2 ("o front não gera mais o id") e
      ADR-005 §2 (linha 223: remover o fallback local; ids pelo banco).
    suggested_action: >-
      No modo remoto: aguardar o repositório, só então atualizar o estado com a linha devolvida pelo banco
      (id e updated_at reais), sem gravar localStorage e sem catch silencioso na carga (mostrar erro).
      Retirar o id dos payloads de INSERT.
  - id: 'TEST-001'
    severity: medium
    finding: >-
      Os testes não pegariam nenhum dos bugs acima. Nenhum teste do hook em modo remoto; nenhum teste remoto
      de criar/atualizar/conflito da fila; nenhum teste SQL em supabase/tests para RLS, janela ou RPC da 2.10.
      Os "25 testes" do Dev Agent Record incluem 14 de tests/unit/agenda-workflow.test.jsx, arquivo da
      Story 2.0e que o commit fd524e8 não alterou (só 11 testes são novos).
    suggested_action: >-
      Adicionar supabase/tests/2.10_agenda_fila.test.sql (papéis, janela, RPC tudo-ou-nada, formato de
      updated_at) e testes do useAgendaWorkflow com repositório remoto mockado (id/updated_at vindos do
      banco, erro sem fallback, fila por linha).
  - id: 'REQ-001'
    severity: medium
    finding: >-
      O AC7 manda aplicar a janela nos UPDATEs da Agenda/Fila, mas o ADR-005 §2.10 (linha 163, decisão D4
      do proprietário) diz que Agenda e Fila ficam fora da janela até decisão explícita. A regra também ficou
      incoerente: fora da janela a secretaria pode INSERT e DELETE, mas não UPDATE nem cascata.
    suggested_action: >-
      @po/proprietário decide (registrar no ADR ou corrigir o AC7); a implementação acompanha a decisão.
  - id: 'REL-004'
    severity: medium
    finding: >-
      UPDATE que o RLS bloqueia (fora da janela, papel sem permissão) devolve 0 linhas e vira
      CONFLITO_EDICAO ("alterado por outra pessoa"), enganando a usuária (agendaRepository.js:103-109).
      excluirAgendamento/excluirItemFilaEspera não usam esperaLinhasAfetadas: mecânico "exclui" com sucesso
      e nada acontece (sonda: mecânico DELETE = 0 linhas, sem erro). As mensagens da RPC ("Acesso negado",
      "fora do horário" com acento) não são mapeadas para SEM_PERMISSAO/FORA_DO_HORARIO.
    suggested_action: >-
      Distinguir conflito de bloqueio (reler a linha ou usar a RPC com ERRCODE próprio); usar
      esperaLinhasAfetadas no delete; dar ERRCODE 42501 às negações da RPC.
  - id: 'SEC-002'
    severity: medium
    finding: >-
      agenda_agendamentos/agenda_fila_espera guardam cópia de nome, telefone e endereço do cliente, e as
      triggers de auditoria copiam esses dados para audit_logs. anonimizar_titular_auditoria não cobre essas
      tabelas (sonda: position('agenda' in prosrc) = 0), e ON DELETE SET NULL mantém o nome após excluir o
      cliente.
    suggested_action: 'Incluir as tabelas da agenda na rotina de anonimização LGPD (ou registrar decisão/dívida com @data-engineer).'
  - id: 'SEC-001'
    severity: low
    finding: >-
      anon tem EXECUTE na RPC pelos privilégios padrão (confirmado em produção: has_function_privilege anon
      = true). A checagem interna nega (papel_usuario() devolve '' por COALESCE; sonda: anon e usuário
      autenticado sem papel recebem "Acesso negado"), então não há bypass.
    suggested_action: 'REVOKE EXECUTE ... FROM PUBLIC, anon, como defesa em profundidade.'
  - id: 'DOC-001'
    severity: medium
    finding: >-
      O Dev Agent Record e o gate anterior não correspondem aos fatos. Houve autorrevisão, a story foi
      para "Ready" em vez de InReview e a Definition of Done veio toda marcada (inclusive "validada pelo @po")
      com as Tasks desmarcadas e sem registro de validação do PO. O AC10 foi dado como "testado" com um
      arquivo que a story não tocou, e a migration aprovada não subia em banco limpo.
    suggested_action: 'Na correção, o @dev atualiza o Dev Agent Record/Tasks com os fatos e passa a story por InReview antes do novo gate.'

acceptance_criteria:
  AC1: {status: PASS, note: 'Duas tabelas novas com os campos de agendaData (prioridade como chave, logística, updated_at).'}
  AC2: {status: FAIL, note: 'DEFAULT gen_random_uuid()::text e FKs reais existem, mas o front ainda gera e envia o id (ARCH-001).'}
  AC3: {status: PASS, note: 'agendaRepository.js assíncrono, com CRUD por linha e funções puras mantidas em agendaData.js.'}
  AC4: {status: FAIL, note: 'Integração via useAgendaWorkflow (correta após 2.0e), mas a fila não usa o repositório e as gravações não são fail-closed (REQ-002, ARCH-001).'}
  AC5: {status: FAIL, note: 'O repositório suporta .eq(updated_at), mas a UI nunca envia updatedAt e o parâmetro é opcional (REL-003).'}
  AC6: {status: FAIL, note: 'A RPC é transacional (tudo ou nada confirmado em sonda), mas rejeita sempre o updated_at no formato do PostgREST (REL-002).'}
  AC7: {status: CONCERNS, note: 'Papéis e janela implementados como o AC pede (sondas OK); conflito com ADR-005 D4 (REQ-001).'}
  AC8: {status: PASS, note: 'Triggers presentes; auditoria registra INSERT/UPDATE/DELETE com o ator certo, inclusive via RPC (sonda). Em produção: 2 triggers por tabela, fn_audit_trigger e fn_set_updated_at.'}
  AC9: {status: CONCERNS, note: 'CRUD de agendamento, conflito, RPC mockada e fail-closed de carga testados no repositório; faltam o remoto da fila e o hook (TEST-001).'}
  AC10: {status: FAIL, note: 'As telas mobile usam o mesmo hook, então herdam REQ-002/ARCH-001; nada foi verificado ou testado nesta story.'}
  AC11: {status: PASS, note: 'npm test 45 arquivos / 362 testes verdes; eslint --quiet sem saída; agendaRepository 309 linhas, hook 375.'}

