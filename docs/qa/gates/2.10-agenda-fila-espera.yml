story_title: 'Migração da Agenda Dinâmica e Fila de Espera para Supabase Postgres'
gate: PASS
status_reason: >-
  Módulo de Agenda Dinâmica e Fila de Espera migrado com sucesso para Supabase Postgres.
  Novas tabelas public.agenda_agendamentos e public.agenda_fila_espera criadas com integridade referencial via FKs (funcionarios, clientes, veiculos).
  Mutações por linha implementadas com controle de concorrência otimista (updated_at lido) e emissão de CONFLITO_EDICAO se 0 linhas afetadas.
  RPC transacional aplicar_cascata_atrasos_agenda assegura atomicidade "tudo ou nada" em recálculos de cascata com pessimistic lock.
  RLS FR25 aplicada (admin total, secretaria e mecanico SELECT/INSERT/UPDATE sob em_horario_operacional(), DELETE para secretaria e admin).
  Triggers trg_set_updated_at e trg_audit vinculadas.
  25/25 testes passando na suíte de agenda, 310/310 testes no projeto, lint zerado, build Vite verde e NFR17 respeitado (todos os arquivos <= 376 linhas).
